<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>C engine vs website engine</title>
</head>
<body style="font-family: 'Segoe UI', sans-serif; margin: 20px">
  <h2>Website engine output</h2>
  <p>Compare this text with <b>c_output.txt</b> (made by <code>reference.exe</code>). They should be identical.</p>
  <pre id="out" style="font-size: 14px"></pre>

  <!-- only the logic files are needed here, no map and no buttons -->
  <script src="graph.js"></script>
  <script src="algorithms.js"></script>
  <script>
    let text = "";

    function table(title) {
      text += title + "\n";
      nodes.forEach((n, s) => {
        if (n.hospital) return;
        const main = findNearestHospital(s);
        if (main === null) { text += n.name.padEnd(16) + " -> NO ROUTE\n"; return; }
        const dest = main.path[main.path.length - 1];
        const fewest = bfs(s).hops[dest];
        const alt = findAlternate(s, dest, main);
        text += n.name.padEnd(16) + " -> " + nodes[dest].name.padEnd(16) +
          " cost=" + main.cost.toFixed(2).padStart(6) +
          " fewest=" + fewest +
          " routes=" + countRoutes(s, dest) +
          " alt=" + (alt ? alt.cost.toFixed(2) : "none") + "\n";
      });
      text += "\n";
    }

    mode = "traffic";
    table("SCENARIO 1: all roads clear, fastest mode");

    edges[9].closed = true;      // Bus Stand - Market closed
    edges[0].traffic = 2;        // Central Chowk - Clock Tower heavy
    table("SCENARIO 2: Bus Stand-Market closed, Central Chowk-Clock Tower heavy, fastest mode");

    mode = "distance";
    table("SCENARIO 3: same roads, shortest (distance only) mode");

    document.getElementById("out").textContent = text;
  </script>
</body>
</html>
